syntax = "proto3";

package de.trustrust.grpc.patients;

import "google/protobuf/empty.proto";

service PatientService {
  rpc Add(PatientRequest) returns (PatientResponse);
  rpc GetAll(google.protobuf.Empty) returns (PatientListResponse);
}

message PatientRequest {
  string first_name = 1;
  string last_name = 2;
}

message PatientResponse {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
}

message PatientListResponse {
  repeated PatientResponse patients = 1;
}